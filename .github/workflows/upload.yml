name: Build and Upload SDK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch name (e.g., main)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    strategy:
      fail-fast: false
      matrix:
        # sdkcraft builds natively, so each architecture needs its own runner.
        include:
          - runner: ubuntu-latest
            platforms: '["ubuntu@24.04:amd64","ubuntu@26.04:amd64"]'
          - runner: ubuntu-24.04-arm
            platforms: '["ubuntu@24.04:arm64","ubuntu@26.04:arm64"]'
    uses: canonical/sdkcraft-actions/.github/workflows/upload.yml@main
    with:
      runs-on: '["${{ matrix.runner }}"]'
      platforms: ${{ matrix.platforms }}
      platform-flag: "--platform"
      track: latest
      risk: edge
    secrets:
      SDKCRAFT_STORE_CREDENTIALS: ${{ secrets.SDKCRAFT_STORE_CREDENTIALS_PROD }}
