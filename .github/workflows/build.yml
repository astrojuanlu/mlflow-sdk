name: Build SDK

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    uses: canonical/sdkcraft-actions/.github/workflows/build.yml@main
    with:
      runs-on: '["${{ matrix.runner }}"]'
